{% load static %}
<br><br><br><br><br>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f9f4e6; /* similar al fondo de la plataforma */
            font-family: Arial, sans-serif;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            margin: 50px auto;
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            position: relative;
            padding-top: 60px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .sello-login {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .sello-login img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .login-card h3 {
            text-align: center;
            color: #156a5c; /* verde de la plataforma */
            margin-bottom: 25px;
        }
        .btn-login {
            background-color: #156a5c;
            color: #fff;
            font-weight: bold;
        }
        .btn-login:hover {
            background-color: #0e4c40;
        }
        a {
            color: #f5a623; /* naranja de la plataforma */
        }
        a:hover {
            text-decoration: none;
            color: #d4881f;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3>INICIAR SESIÓN</h3>
    <div class="sello-login">
        <img src="{% static 'img/sello.png' %}" alt="Sello">
    </div>

    {% if form.errors %}
    <div class="alert alert-danger">
        Usuario o contraseña incorrectos.
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.username.label_tag }}
            {{ form.username }}
        </div>
        <div class="mb-3">
            {{ form.password.label_tag }}
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-login w-100">Entrar</button>
    </form>

    <p class="mt-3 text-center">
        ¿No tienes cuenta? <a href="{% url 'registrar_admin' %}">Regístrate aquí</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
