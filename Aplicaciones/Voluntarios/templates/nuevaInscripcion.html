{% extends './plantilla.html' %}
{% block contenido %}

<br><br><br><br><br>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm p-4">
                <h2 class="text-muted fs-4 text-center">
                    Nueva Inscripción
                </h2>

                <form action="{% url 'guardarInscripcion' %}"
                      method="post"
                      enctype="multipart/form-data"
                      id="frm_nueva_inscripcion">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Voluntario</label>
                        <select name="voluntario" class="form-select">
                            <option value="">Seleccione</option>
                            {% for v in voluntarios %}
                            <option value="{{ v.id }}">{{ v }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Actividad</label>
                        <select name="actividad" class="form-select">
                            <option value="">Seleccione</option>
                            {% for a in actividades %}
                            <option value="{{ a.id }}">{{ a.titulo }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Documento de Compromiso</label>
                        <input type="file" name="documento_compromiso" class="form-control">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button class="btn btn-success btn-lg">
                            Guardar
                        </button>
                        <a href="{% url 'InscripcionIndex' %}"
                           class="btn btn-secondary btn-lg">
                            Cancelar
                        </a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script>
$(document).ready(function(){

    $("#frm_nueva_inscripcion").validate({
        rules:{
            voluntario:{
                required:true
            },
            actividad:{
                required:true
            },
            documento:{
                required:true,
                extension:"pdf|jpg|png"
            }
        },
        messages:{
            voluntario:"Seleccione un voluntario",
            actividad:"Seleccione una actividad",
            documento:"Suba el documento (PDF o imagen)"
        },
        errorClass:"text-danger",
        errorElement:"small",
        highlight:function(element){
            $(element).addClass("is-invalid");
        },
        unhighlight:function(element){
            $(element).removeClass("is-invalid");
        }
    });

});
</script>
{% endblock %}
